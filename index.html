<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Supports</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
        }

        h1 {
            color: #fff;
            margin-bottom: 30px;
            text-align: center;
        }

        .app-card {
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .app-card h2 {
            color: #1a1a2e;
            margin-bottom: 15px;
        }

        .app-card p {
            color: #666;
            margin-bottom: 20px;
        }

        .links a {
            display: inline-block;
            padding: 10px 20px;
            margin-right: 10px;
            margin-bottom: 10px;
            background: #06b6d4;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .links a:hover {
            background: #0891b2;
            color: #ffffff !important;
        }

        .links a.secondary {
            background: #64748b;
        }

        .links a.secondary:hover {
            background: #475569;
        }
    </style>
</head>

<body>
    <h1>🎮 App Supports</h1>

    <div class="app-card">
        <h2>Sudoku Zen</h2>
        <p>A beautiful and relaxing Sudoku puzzle game with intelligent hints and clean design.</p>
        <div class="links">
            <a href="sudoku-zen/privacy.html">Privacy Policy</a>
            <a href="sudoku-zen/support.html" class="secondary">Support</a>
        </div>
    </div>

    <!-- Add more apps here in the future -->

        <h2>Another App</h2>
        <p>Description of another app.</p>
        <div class="links">
            <a href="another-app/privacy.html">Privacy Policy</a>
            <a href="another-app/support.html" class="secondary">Support</a>
        </div>
    </div>
    -->
</body>

</html>
